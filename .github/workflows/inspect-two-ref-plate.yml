name: Inspect PACS two-reference plate metadata
on:
  push:
    branches: [main]
    paths:
      - scripts/inspect_two_ref_plate.py
      - .github/workflows/inspect-two-ref-plate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check QC and Study plate labels
        run: python scripts/inspect_two_ref_plate.py
