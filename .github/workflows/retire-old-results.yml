name: Remove obsolete result directories
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retire-old-results.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Remove only rejected result directories
        shell: bash
        run: |
          set -euo pipefail
          test -d results/trial1a
          test -d results_v1/pacs_trial1
          test -f results/trial1b/README.md
          test -f results/trial2_peptide/README.md
          test -f results/trial3_eno1/README.md
          git rm -r -- results/trial1a results_v1/pacs_trial1
          test ! -e results/trial1a
          test ! -e results_v1/pacs_trial1
      - name: Commit archived cleanup without touching other results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove rejected normalization output folders [skip ci]"
          git push
