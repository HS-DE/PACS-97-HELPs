name: PACS two-reference log2 plate and sample normalization
on:
  push:
    branches: [main]
    paths:
      - scripts/pacs_two_reference_plate_trial.py
      - .github/workflows/pacs-two-ref-plate-trial.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pacs-two-reference-normalization
  cancel-in-progress: false
jobs:
  compare-ten-methods:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original scientific workflow dependencies
        run: python -m pip install numpy pandas matplotlib
      - name: Compute all factor branches, corrected log2 matrices and figures
        run: |
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 \
            python scripts/pacs_two_reference_plate_trial.py
      - name: Validate ten branches, factors, source mapping and Internal-QC
        run: |
          OPENBLAS_NUM_THREADS=2 python - <<'PY'
          from pathlib import Path
          import json,math,hashlib
          import numpy as np
          import pandas as pd
          root=Path("results/two_reference_plate_normalization_v1")
          assert root.is_dir()
          inp=pd.read_csv("pg_matrix.tsv",sep="\t",dtype=str,keep_default_na=False)
          names=inp.columns[5:].tolist()
          raw=inp[names].apply(pd.to_numeric,errors="coerce").to_numpy(dtype=float)
          rawlog=np.full(raw.shape,np.nan)
          valid=np.isfinite(raw)&(raw>0);rawlog[valid]=np.log2(raw[valid])
          assert inp.shape==(6675,80)
          manifest=json.loads((root/"run_manifest.json").read_text())
          assert manifest["protein_rows"]==6675 and manifest["samples"]==75
          assert manifest["log2_for_factors_and_outputs"] and manifest["no_imputation"]
          for name in ("pg_matrix.tsv","LH_ratio_tables_2026.10.13—ALL-HELP.xlsx",
                       "all_QC_metadata.xlsx","all_sample_metadata.xlsx"):
              assert manifest["input_sha256"][name]==hashlib.sha256(Path(name).read_bytes()).hexdigest()
          assert manifest["plate_sample_counts"]=={"1":27,"2":27,"3":21}
          table=pd.read_csv(root/"all_methods_group_cv.csv")
          assert len(table)==40
          from collections import Counter
          actual=Counter()
          for label,refs in (("two_refs",("STGSWSTLK","VYFAGFPR")),
                             ("pros1_only",("VYFAGFPR",))):
              for method in ("a_plate_ratio","b_plate_ratio_plus_sample",
                             "b2_sample_ratio_only","c_plate_protein","d_sample_protein_only"):
                  p=root/label/method
                  factor=pd.read_csv(p/"sample_factors.csv")
                  assert len(factor)==75 and set(factor.sample_id)==set(names)
                  assert Counter(factor.group)=={"Internal-QC":6,"pooled QC":15,"HC":27,"S":27}
                  assert Counter(factor.plate)=={1:27,2:27,3:21}
                  assert np.allclose(factor.f1_plate_log2+factor.f2_sample_log2,
                                     factor.total_factor_log2,atol=1e-11)
                  assert np.allclose(factor[factor.group=="Internal-QC"].total_factor_log2,0)
                  assert np.allclose(factor[factor.group=="pooled QC"].f2_sample_log2,0)
                  if method in ("b2_sample_ratio_only","d_sample_protein_only"):
                      assert np.allclose(factor.f1_plate_log2,0)
                  if method in ("a_plate_ratio","c_plate_protein"):
                      assert np.allclose(factor.f2_sample_log2,0)
                  if method in ("a_plate_ratio","b_plate_ratio_plus_sample","c_plate_protein"):
                      assert factor[factor.group=="pooled QC"].f1_plate_log2.nunique()<=3
                  mat=pd.read_csv(p/"corrected_pg_log2.tsv",sep="\t",dtype=str,
                                  keep_default_na=False,low_memory=False)
                  assert mat.shape==inp.shape and mat.columns.tolist()==inp.columns.tolist()
                  log=mat[names].apply(pd.to_numeric,errors="coerce").to_numpy(float)
                  offsets=factor.set_index("sample_id").loc[names,"total_factor_log2"].to_numpy(float)
                  assert np.allclose(log,rawlog+offsets[None,:],rtol=1e-11,
                                     atol=5e-12,equal_nan=True),(label,method)
                  idx=[names.index(n) for n in factor.loc[factor.group=="Internal-QC","sample_id"]]
                  assert np.array_equal(log[:,idx],rawlog[:,idx],equal_nan=True)
                  rtab=pd.read_csv(p/"selected_HELP_ratio_log2.csv")
                  assert len(rtab)==75
                  for sequence in refs:
                      pre=rtab["raw_log2_ratio_"+sequence].to_numpy()
                      aft=rtab["post_plate_log2_ratio_"+sequence].to_numpy()
                      if method in ("a_plate_ratio","b_plate_ratio_plus_sample"):
                          assert np.allclose(aft-pre,factor.f1_plate_log2,atol=1e-11)
                      else:assert np.allclose(aft,pre,atol=1e-12)
                  report=json.loads((p/"factor_reference.json").read_text())
                  assert report["selected_sequences"]==list(refs)
                  if method in ("a_plate_ratio","b_plate_ratio_plus_sample","c_plate_protein"):
                      assert len(report["plate_reference_per_plate"])==3
                      assert np.isclose(
                          np.median(list(report["plate_reference_per_plate"].values())),
                          report["plate_reference_global"])
                  cv=pd.read_csv(p/"group_cv_summary.csv")
                  assert len(cv)==4 and cv.n_proteins_with_cv.min()>4000
                  assert len(pd.read_csv(p/"pca_summary.csv"))==4
                  assert len(list(p.glob("*.png")))==5
                  assert all(f.stat().st_size>2000 for f in p.glob("*.png"))
                  actual[label]+=1
          assert dict(actual)=={"two_refs":5,"pros1_only":5}
          assert (root/"00_all_methods_study_cv_comparison.png").is_file()
          print("PASS: 10 branches, every f1/f2 and corrected ratio verified, 6675x75 log2 matrices, 51 PNGs, original QC unchanged")
          PY
      - name: Commit independent experimental results only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- results/two_reference_plate_normalization_v1
          if ! git diff --cached --quiet; then
            git commit -m "Publish ten PACS log2 two-reference and PROS1-only trials [skip ci]"
            git push
          fi
