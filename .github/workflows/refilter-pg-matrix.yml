name: Refilter newly uploaded pg_matrix by metadata
on:
  push:
    branches: [main]
    paths:
      - scripts/refilter_pg_matrix.py
      - .github/workflows/refilter-pg-matrix.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refilter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refilter matrix using existing 75-sample metadata
        run: python scripts/refilter_pg_matrix.py
      - name: Assert only desired matrix and report changed
        run: |
          git diff --name-only
          unexpected="$(git diff --name-only | grep -Ev '^(pg_matrix.tsv|FILTERING_REPORT.md)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected file modifications: $unexpected"
            exit 1
          fi
      - name: Commit filtered pg_matrix and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pg_matrix.tsv FILTERING_REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "Refilter uploaded protein matrix to metadata-approved 75 samples [skip ci]"
            git push
          fi
