name: Yeast spike-in protein QC
on:
  push:
    branches: [main]
    paths:
      - pg_matrix.tsv
      - all_QC_metadata.xlsx
      - all_sample_metadata.xlsx
      - scripts/yeast_protein_qc.py
      - .github/workflows/yeast-protein-qc.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plotting library
        run: python -m pip install matplotlib==3.10.1
      - name: Calculate yeast protein statistics and plots
        run: python scripts/yeast_protein_qc.py
      - name: Commit reproducible results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/yeast_qc/
          if ! git diff --cached --quiet; then
            git commit -m "Update yeast spike-in group statistics and figures"
            git push
          fi
