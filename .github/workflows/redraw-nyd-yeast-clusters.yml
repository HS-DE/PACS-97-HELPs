name: Repair overlapping NYD yeast clustering heatmaps
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/redraw-nyd-yeast-clusters.yml
      - scripts/redraw_nyd_yeast_clusters.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  delete-redraw-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical and plotting dependencies
        run: python -m pip install numpy scipy matplotlib scikit-learn pillow
      - name: Delete the two old figures and re-render corrected layouts
        run: |
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 \
            python scripts/redraw_nyd_yeast_clusters.py
      - name: Independently validate both new figures and unchanged results
        run: |
          python - <<'PY'
          import csv
          import hashlib
          from pathlib import Path
          from PIL import Image
          directory=Path("NYD_data/40samples/YEAST_PCA_correlation_clustering")
          targets=("03_peptide_sample_cluster_heatmap.png",
                   "06_protein_sample_cluster_heatmap.png")
          for filename in targets:
              p=directory/filename
              with Image.open(p) as im:
                  im.verify()
              with Image.open(p) as im:
                  w,h=im.size
                  assert w>=3500 and h>=1700,(filename,w,h)
                  print(filename,"resolution",w,h,"sha256",hashlib.sha256(p.read_bytes()).hexdigest())
          assert len(list(directory.glob("*.png")))==6
          for name in ("peptide_sample_cluster_order.csv","protein_sample_cluster_order.csv"):
              with (directory/name).open(encoding="utf-8-sig",newline="") as f:
                  rows=list(csv.DictReader(f))
              assert len(rows)==40
              assert sorted(int(x["cluster_leaf_order"]) for x in rows)==list(range(1,41))
          print("PASS: figure layout overlap guard and sample order consistency")
          PY
      - name: Commit exactly two new PNGs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          root="NYD_data/40samples/YEAST_PCA_correlation_clustering"
          git add -- "$root/03_peptide_sample_cluster_heatmap.png" \
                     "$root/06_protein_sample_cluster_heatmap.png"
          git diff --cached --name-status
          count=$(git diff --cached --name-only | wc -l)
          test "$count" -eq 2
          git commit -m "Replace two overlapping NYD yeast hierarchical clustering PNGs [skip ci]"
          git push
