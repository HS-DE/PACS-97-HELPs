name: PACS yeast protein Trial 3 (ENO1 variants)
on:
  push:
    branches: [main]
    paths:
      - scripts/pacs_eno1_protein_trial.py
      - .github/workflows/pacs-eno1-protein-trial.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pacs-results-main
  cancel-in-progress: false
jobs:
  run-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plotting and numerical dependencies
        run: python -m pip install numpy pandas matplotlib scikit-learn
      - name: Archive current results without overwriting any version
        shell: bash
        run: |
          set -euo pipefail
          test -f results/README.md
          test -f EN01.xlsx
          test -f "LH_ratio_tables_2026.10.13—ALL-HELP.xlsx"
          max_version=0
          for folder in results_v*; do
            if [[ -d "$folder" && "$folder" =~ ^results_v([0-9]+)$ ]]; then
              version="$(echo "$folder" | sed 's/^results_v//')"
              if (( version > max_version )); then max_version=$version; fi
            fi
          done
          archive="results_v$((max_version+1))"
          if [[ -e "$archive" ]]; then
            echo "Refusing to overwrite $archive" >&2
            exit 1
          fi
          git mv results "$archive"
          mkdir results
          echo "PACS_RESULTS_ARCHIVE=$archive" >> "$GITHUB_ENV"
          test -f "$archive/README.md"
          echo "Previous results safely archived as $archive"
      - name: Run Trial 3 single-largest-rowsum and two-linear-sum protein factor1
        run: OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 python scripts/pacs_eno1_protein_trial.py
      - name: Validate all outputs and unchanged QC intensities
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          root=Path("results")
          for file in ("README.md","pg_matrix_filtered.tsv","screening_report.json",
                       "sample_factors.csv","eno1_protein_details.csv",
                       "eno1_rowsum_ranking.csv","all_stage_cv_summary.csv",
                       "all_stage_pca_summary.csv"):
              assert (root/file).is_file(), file
          source=pd.read_csv("pg_matrix.tsv",sep="\t",dtype=str,keep_default_na=False)
          assert len(source)==6675
          raw=pd.read_csv(root/"pg_matrix_filtered.tsv",sep="\t",dtype=str,keep_default_na=False)
          assert raw.equals(source), "Original protein matrix content changed during pipeline"
          rank=pd.read_csv(root/"eno1_rowsum_ranking.csv")
          assert len(rank)==2
          assert rank.used_for_single_protein_correction.sum()==1
          selected=rank.loc[rank.row_sum_linear_all75.idxmax(),"protein_id"]
          assert rank.loc[rank.used_for_single_protein_correction,"protein_id"].iloc[0]==selected
          factors=pd.read_csv(root/"sample_factors.csv")
          assert len(factors)==75
          assert (factors.two_protein_linear_sum>0).all()
          assert np.allclose(factors.two_protein_linear_sum,
                             factors.P00924_linear_intensity+factors.P00925_linear_intensity)
          assert (factors.selected_protein==selected).all()
          cv=pd.read_csv(root/"all_stage_cv_summary.csv")
          assert len(cv)==24
          pca=pd.read_csv(root/"all_stage_pca_summary.csv")
          assert len(pca)==12
          assert len(list(root.rglob("*.png")))==24
          assert not list(root.rglob("*.svg"))
          qcs=["Internal-QC","pooled QC"]
          for grp in qcs:
              subset=cv[cv.group==grp]
              assert np.allclose(subset.median_cv_pct,
                                 subset[subset.stage=="raw"].median_cv_pct.iloc[0],
                                 rtol=0,atol=1e-11)
          for method in ("single_max_rowsum","sum_two"):
              folder=root/("method_"+method)
              for stage in ("factor1","factor1_factor2"):
                  path=folder/("pg_matrix_"+stage+"_linear.tsv")
                  assert path.exists(),path
                  out=pd.read_csv(path,sep="\t",dtype=str,keep_default_na=False)
                  assert len(out)==6675
                  for sample in factors.loc[factors.group.isin(qcs),"sample_id"]:
                      assert source[sample].equals(out[sample]),f"Unchanged QC data drifted: {sample}"
                  assert (folder/("pg_matrix_"+stage+"_log2.tsv")).exists()
              for view in ("all_groups","study_only"):
                  png=list((folder/"figures"/view).glob("*.png"))
                  assert len(png)==6,(method,view,len(png))
          print("PASS: 6675 proteins x 75 samples, 2 strategies x 3 stages, 24 PNG, both QC groups exactly unchanged")
          PY
      - name: Commit new results and preserved prior version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- results "$PACS_RESULTS_ARCHIVE"
          if ! git diff --cached --quiet; then
            git commit -m "Archive prior results as $PACS_RESULTS_ARCHIVE and publish EN01 yeast protein trial [skip ci]"
            git push
          fi
