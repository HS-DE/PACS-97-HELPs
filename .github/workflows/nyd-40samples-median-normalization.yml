name: NYD 40 samples median normalization with yeast holdout
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nyd-40samples-median-normalization.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical and plotting packages
        run: python -m pip install numpy matplotlib
      - name: Perform median normalization and yeast holdout evaluation
        run: |
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 \
            python scripts/nyd_sample_median_normalization.py
      - name: Independently check both corrected TSV matrices and factors
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,hashlib,math,json,statistics
          import numpy as np
          base=Path("NYD_data/40samples")
          dest=base/"median_normalization_40samples"
          manifest=json.loads((dest/"run_manifest.json").read_text(encoding="utf-8"))
          assert manifest["no_imputation"] and manifest["pg_pr_calibrated_independently"]
          assert not manifest["yeast_used_for_normalization"]
          assert manifest["sample_count"]==40
          assert manifest["batch_sizes"]=={"T001":16,"T002":8,"T003":8,"T004":8}
          def read(name):
              with (dest/name).open(encoding="utf-8-sig",newline="") as f:
                  return list(csv.DictReader(f))
          factors=read("median_normalization_sample_factors.csv")
          assert len(factors)==80
          assert len(set((r["matrix"],r["sample_id"]) for r in factors))==80
          mapping={(r["matrix"],r["sample_id"]):float(r["multiplicative_factor"]) for r in factors}
          for name in ("pg","pr"):
              p=base/f"NYD_{name}_matrix2.tsv"
              q=dest/f"NYD_{name}_matrix2_median_normalized.tsv"
              assert p.is_file() and q.is_file() and q.stat().st_size>1_000_000
              assert manifest["input_sha256"][name.upper()]==hashlib.sha256(p.read_bytes()).hexdigest()
              with p.open(encoding="utf-8-sig",newline="") as ff, q.open(encoding="utf-8-sig",newline="") as gg:
                  original=csv.reader(ff,delimiter="\t")
                  corrected=csv.reader(gg,delimiter="\t")
                  h=next(original); h2=next(corrected)
                  assert h==h2
                  cols=[(j,mapping[name,s]) for j,s in enumerate(h) if (name,s) in mapping]
                  assert len(cols)==40
                  n=0
                  for a,b in zip(original,corrected):
                      assert len(a)==len(h)==len(b)
                      for j,c in cols:
                          try:
                              x=float(a[j])
                              if not math.isfinite(x) or x<=0:raise ValueError
                          except (ValueError,TypeError):
                              assert a[j]==b[j],"Invalid/missing original values modified"
                              continue
                          y=float(b[j])
                          assert math.isfinite(y) and y>0
                          assert math.isclose(y,x*c,rel_tol=5e-14,abs_tol=1e-14),(name,n,j,x,y,c)
                      n+=1
                  assert n>500
                  assert next(original,None) is None and next(corrected,None) is None
              print("VALIDATED matrix",name,n,"PG/PR rows; source and adjusted measurement consistency")
          assert len(list(dest.glob("*.png")))==6
          assert all(p.stat().st_size>15000 for p in dest.glob("*.png"))
          stats=read("yeast_cv_before_after.csv")
          assert len(stats)==15
          assert {x["batch"] for x in stats}=={"All_40","T001","T002","T003","T004"}
          assert {x["analyte"] for x in stats}=={"AADALLLK","VNQIGTLSESIK","P00924_protein"}
          sample=read("yeast_before_after_per_sample.csv")
          assert len(sample)==120
          for item in sample:
              k="pg" if item["factor_source"]=="PG" else "pr"
              assert math.isclose(float(item["applied_factor"]),mapping[k,item["sample_id"]],rel_tol=1e-14)
              assert math.isclose(float(item["normalized_intensity"]),
                    float(item["raw_intensity"])*float(item["applied_factor"]),rel_tol=1e-14)
          for item in stats:
              r=[x for x in sample if x["analyte"]==item["analyte"] and
                 (item["batch"]=="All_40" or x["batch"]==item["batch"])]
              for fld,field in (("raw_cv_pct","raw_intensity"),("normalized_cv_pct","normalized_intensity")):
                  y=[float(x[field]) for x in r]
                  cv=100*statistics.stdev(y)/statistics.mean(y)
                  assert math.isclose(cv,float(item[fld]),rel_tol=1e-11)
          assert manifest["input_sha256"]["META"]==hashlib.sha256((base/"NYD_sampleinfo2.xlsx").read_bytes()).hexdigest()
          assert manifest["input_sha256"]["YEAST"]==hashlib.sha256((base/"YEAST.xlsx").read_bytes()).hexdigest()
          print("PASS: 40 sample PG+PR median normalizations, source-hash protection, independent yeast QC CVs, six plots")
          PY
      - name: Commit only independent median-normalization directory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- NYD_data/40samples/median_normalization_40samples
          if ! git diff --cached --quiet; then
            git commit -m "Publish NYD 40-sample PG/PR median normalization with yeast QC holdout [skip ci]"
            git push
          fi
