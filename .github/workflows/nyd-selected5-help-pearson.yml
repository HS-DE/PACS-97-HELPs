name: NYD five user-selected HELP Heavy Pearson vs PG medians
on:
  push:
    branches: [main]
    paths:
      - scripts/nyd_user_selected5_help_pearson_39samples.py
      - .github/workflows/nyd-selected5-help-pearson.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nyd-user-selected5-help-pearson
  cancel-in-progress: false
jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install calculation and figure dependencies
        run: python -m pip install numpy pandas matplotlib scipy
      - name: Correlate five manually selected HELP Heavy with two raw PG medians
        run: |
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 \
            python scripts/nyd_user_selected5_help_pearson_39samples.py
      - name: Validate independent output tables
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p = Path("NYD_data/40samples/user_selected5_HELP_Heavy_PG_Pearson_39samples")
          m = json.loads((p/"run_manifest.json").read_text())
          assert m["n_samples"] == 39 and m["n_PG_total"] == 4264
          assert m["excluded_sample"] == "MAP26092326E01"
          assert 100 <= m["n_PG_common_39"] <= 4264
          assert m["HELP_selected_manually_from_PACS"] == [
              "FSVVYAK","STGSWSTLK","VTGWGNLK","VVEESELAR","VYFAGFPR"
          ]
          def read(name):
              with (p/name).open(encoding="utf-8-sig",newline="") as f:
                  return list(csv.DictReader(f))
          samples = read("sample_level_log2_intensities.csv")
          corr = read("pearson_summary_all_and_by_batch.csv")
          common = read("common_39_PG_protein_list.csv")
          assert len(samples) == 39 and len({r["sample_id"] for r in samples}) == 39
          assert len(common) == m["n_PG_common_39"]
          assert len(corr) == 60
          assert {r["PG_basis"] for r in corr} == {"all_detected_PG","common_39_PG"}
          assert {r["scope"] for r in corr} == {"ALL_39","T001","T002","T003","T004"}
          for r in corr:
              if r["pearson_r"]:
                  assert -1 <= float(r["pearson_r"]) <= 1
          for image in p.glob("*.png"):
              assert image.stat().st_size > 12000
          assert len(list(p.glob("*.png"))) == 2
          print("PASS: raw source provenance, 39 samples, 5 manual HELP, shared PG set, 60 Pearson results and two figures")
          PY
      - name: Commit isolated analysis results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- NYD_data/40samples/user_selected5_HELP_Heavy_PG_Pearson_39samples
          if ! git diff --cached --quiet; then
            git commit -m "Add NYD 39-sample five HELP Heavy vs PG Pearson results [skip ci]"
            git push
          fi
