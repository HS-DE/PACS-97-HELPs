name: Filter NYD sampleinfo to protein-matrix samples
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/filter-nyd-sampleinfo.yml
      - scripts/filter_nyd_sampleinfo.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Filter NYD metadata using matrix columns 6 onward
        run: python scripts/filter_nyd_sampleinfo.py
      - name: Independently verify 16 retained samples
        run: |
          python - <<'PY'
          import csv,zipfile,sys
          from pathlib import Path
          sys.path.insert(0,"scripts")
          from filter_nyd_sampleinfo import PG,INFO,REPORT,parsed
          with PG.open(encoding="utf-8-sig",newline="") as f:
              expected=next(csv.reader(f,delimiter="\t"))[5:]
          with zipfile.ZipFile(INFO) as z:
              _,_,_,_,records=parsed(z)
          assert len(records)==17
          assert [r["D"] for _,r in records[1:]]==sorted(expected,key=lambda x:[r["D"] for _,r in records[1:]].index(x)) or set(r["D"] for _,r in records[1:])==set(expected)
          assert all(len(r)==18 for _,r in records)
          assert REPORT.exists()
          print("PASS: 16 samples, 18 columns, header preserved")
          PY
      - name: Commit filtered workbook and audit report only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NYD_data/NYD_sampleinfo.xlsx NYD_data/NYD_sampleinfo_filter_report.md
          if ! git diff --cached --quiet; then
            git commit -m "Filter NYD sampleinfo to 16 protein matrix samples [skip ci]"
            git push
          fi
