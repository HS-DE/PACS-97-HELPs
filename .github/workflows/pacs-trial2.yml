name: PACS Trial 2 - yeast and HELP log2 factors
on:
  push:
    branches: [main]
    paths:
      - scripts/pacs_trial2.py
      - scripts/pacs_trial1.py
      - scripts/filter_samples.py
      - scripts/yeast_protein_qc.py
      - all_sample_metadata.xlsx
      - all_QC_metadata.xlsx
      - sample-QC-InternalQC-HELP_yeast.xlsx
      - LH_ratio_tables_2026.9.22—ALL-HELP.xlsx
      - pg_matrix.tsv
      - .github/workflows/pacs-trial2.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical analysis and plotting
        run: python -m pip install numpy pandas matplotlib scikit-learn
      - name: Compute Trial 2 and validate QC invariance
        run: OPENBLAS_NUM_THREADS=2 python scripts/pacs_trial2.py
      - name: Verify four scenarios, two views, PNG only
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path("results/pacs_trial2")
          scenarios=("a_factor1", "a_factor1_plus_factor2", "b_factor1", "b_factor1_plus_factor2")
          views=("all_groups", "study_only")
          for sc in scenarios:
              p=root/sc
              for name in ("pg_matrix_corrected_log2.tsv", "pg_matrix_corrected_linear.tsv", "group_cv_summary.csv", "per_protein_cv.csv", "applied_factors.csv"):
                  assert (p/name).is_file(), f"Missing {p/name}"
              for view in views:
                  figures=list((p/"figures"/view).glob("*.png"))
                  assert len(figures)==5, f"Expected five PNGs in {p}/figures/{view}, got {len(figures)}"
          assert not list(root.rglob("*.svg")), "Unexpected SVG results"
          assert (root/"README.md").is_file()
          print("PASS: 4 corrections x 2 views = 8 plot collections, 40 PNGs, no SVGs.")
          PY
      - name: Commit Trial 2 outputs without changing source or earlier trials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/pacs_trial2/
          if ! git diff --cached --quiet; then
            git commit -m "Publish Trial 2 yeast plus HELP log2 correction results and PNG analyses"
            git push
          fi
