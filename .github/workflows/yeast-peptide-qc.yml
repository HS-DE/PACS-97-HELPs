name: Yeast spike-in peptide QC
on:
  push:
    branches: [main]
    paths:
      - sample-QC-InternalQC-HELP_yeast.xlsx
      - all_QC_metadata.xlsx
      - all_sample_metadata.xlsx
      - scripts/yeast_peptide_qc.py
      - scripts/filter_samples.py
      - scripts/yeast_protein_qc.py
      - .github/workflows/yeast-peptide-qc.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plotting library
        run: python -m pip install matplotlib==3.10.1
      - name: Filter samples, compute detection and CV, render plots
        run: python scripts/yeast_peptide_qc.py
      - name: Commit cleaned workbook and QC results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sample-QC-InternalQC-HELP_yeast.xlsx results/yeast_peptide_qc/
          if ! git diff --cached --quiet; then
            git commit -m "Update filtered yeast peptide matrix and group QC figures"
            git push
          fi
