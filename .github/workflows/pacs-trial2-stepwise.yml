name: PACS Trial 2 stepwise new matrix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical libraries
        run: python -m pip install numpy pandas matplotlib scikit-learn
      - name: Archive current results under next free version (never overwrite)
        shell: bash
        run: |
          set -euo pipefail
          test -f results/README.md
          max_version=0
          for folder in results_v*; do
            if [[ -d "$folder" && "$folder" =~ ^results_v([0-9]+)$ ]]; then
              version="${BASH_REMATCH[1]}"
              if (( version > max_version )); then max_version=$version; fi
            fi
          done
          archive="results_v$((max_version+1))"
          if [[ -e "$archive" ]]; then
            echo "Refusing to overwrite existing archive: $archive" >&2
            exit 1
          fi
          git mv results "$archive"
          mkdir results
          echo "PACS_RESULTS_ARCHIVE=$archive" >> "$GITHUB_ENV"
          test -f "$archive/README.md"
          echo "Archived the previous results into $archive; creating fresh results/"
      - name: Re-filter matrix and run Raw -> Factor1 -> Factor1+Factor2
        run: OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 python scripts/pacs_trial2_stepwise.py
      - name: Validate saved data and visualizations
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          root=Path("results")
          for f in ("README.md","screening_report.json","pg_matrix_filtered.tsv",
                    "sample_factors.csv","yeast_factor_details.csv",
                    "all_stage_cv_summary.csv","all_stage_pca_summary.csv"):
              assert (root/f).is_file(), f"Missing: {f}"
          source=pd.read_csv("pg_matrix.tsv",sep="\t",nrows=0)
          filtered=pd.read_csv(root/"pg_matrix_filtered.tsv",sep="\t",nrows=0)
          assert len(filtered.columns)==80
          assert len(source.columns)>=len(filtered.columns)
          assert len(pd.read_csv(root/"pg_matrix_filtered.tsv",sep="\\t"))==6677
          pngs=list(root.rglob("*.png"))
          assert len(pngs)==24, f"Expected 24 PNG figures, got {len(pngs)}"
          assert not list(root.rglob("*.svg")), "Unexpected SVG result"
          for method in ("a","b"):
              p=root/("method_"+method)
              for stage in ("factor1","factor1_factor2"):
                  assert (p/("pg_matrix_"+stage+"_linear.tsv")).is_file()
                  assert (p/("pg_matrix_"+stage+"_log2.tsv")).is_file()
              for view in ("all_groups","study_only"):
                  files=list((p/"figures"/view).glob("*.png"))
                  assert len(files)==6, f"Expected 6 PNGs in {p}/{view}"
          cv=pd.read_csv(root/"all_stage_cv_summary.csv")
          assert len(cv)==24, f"Expected 2 methods x 3 stages x 4 groups, got {len(cv)}"
          for group in ("Internal-QC","pooled QC"):
              block=cv[cv.group==group]
              baseline=block[block.stage=="raw"].median_cv_pct.iloc[0]
              assert (block.median_cv_pct-baseline).abs().max()<1e-10
          print("PASS: 6677 protein rows, 75 samples, 2 methods x 2 views x 6 PNG = 24 figures; QC unchanged")
          PY
      - name: Commit versioned archive and fresh Trial 2 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- results "$PACS_RESULTS_ARCHIVE"
          if ! git diff --cached --quiet; then
            git commit -m "Archive current results under $PACS_RESULTS_ARCHIVE and rerun Trial 2 with 2026-10-13 HELP"
            git push
          fi
