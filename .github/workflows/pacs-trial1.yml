name: PACS Trial 1 median-ratio correction
on:
  push:
    branches: [main]
    paths:
      - pg_matrix.tsv
      - LH_ratio_tables_2026.9.22—ALL-HELP.xlsx
      - all_QC_metadata.xlsx
      - all_sample_metadata.xlsx
      - scripts/pacs_trial1.py
      - scripts/filter_samples.py
      - scripts/yeast_protein_qc.py
      - .github/workflows/pacs-trial1.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical analysis libraries
        run: python -m pip install numpy pandas matplotlib scikit-learn
      - name: Compute trial 1 factors, correct pg matrix, compare CV and PCA
        run: python scripts/pacs_trial1.py
      - name: Commit results and all figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/pacs_trial1/
          if ! git diff --cached --quiet; then
            git commit -m "Update PACS trial 1 normalized protein table and QC analysis"
            git push
          fi
