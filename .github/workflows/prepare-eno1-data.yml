name: Prepare ENO1 protein data (metadata-only)
on:
  push:
    branches: [main]
    paths:
      - scripts/prepare_eno1_protein_data.py
      - .github/workflows/prepare-eno1-data.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  separate-and-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect ENO1 protein records and uploaded EN01 worksheet layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from prepare_eno1_protein_data import sheet_path, shared_strings, sheet_rows
          from xml.etree import ElementTree as ET
          import zipfile
          found=[]
          with Path("pg_matrix.tsv").open("r",encoding="utf-8-sig") as f:
              header=f.readline().rstrip("\r\n").split("\t")
              for lineno,line in enumerate(f,2):
                  cols=line.rstrip("\r\n").split("\t")
                  protein=cols[header.index("Protein.Names")]
                  if "ENO" in protein.upper() or "YEAST" in protein.upper():
                      found.append((lineno,cols[0],protein))
          print("PROTEIN CANDIDATES:",found[:100],flush=True)
          with zipfile.ZipFile("EN01.xlsx") as z:
              sheet,key=sheet_path(z)
              rec=sheet_rows(ET.fromstring(z.read(key)),shared_strings(z))
          print("EN01 LAYOUT:",sheet,"rows",len(rec),"first header columns",[(k,v) for k,v in sorted(rec[0].items())[:12]],"protein IDs",[r.get(1) for r in rec[1:10]],flush=True)
          PY
      - name: Filter EN01 samples and remove only ENO1_YEAST protein rows
        run: python scripts/prepare_eno1_protein_data.py
      - name: Verify row and sample preservation; no results changed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from yeast_protein_qc import metadata
          from prepare_eno1_protein_data import sheet_path, sheet_rows, shared_strings, ANNOTATIONS
          from xml.etree import ElementTree as ET
          import zipfile
          labels=metadata()
          with open("pg_matrix.tsv", encoding="utf-8-sig") as f:
              hdr=f.readline().rstrip("\n\r").split("\t")
              rows=[line.rstrip("\n\r").split("\t") for line in f]
          assert hdr[:5]==ANNOTATIONS and set(hdr[5:])==set(labels) and len(hdr)==80
          assert len(rows)==6675 and all(r[2] not in {"ENO1_YEAST","ENO2_YEAST"} and len(r)==80 for r in rows)
          with zipfile.ZipFile("EN01.xlsx") as z:
              sheet,key=sheet_path(z)
              records=sheet_rows(ET.fromstring(z.read(key)),shared_strings(z))
          assert len(records)==3
          assert len(records[0])==75
          assert set(records[0][i] for i in range(2,77))==set(labels)
          assert [r.get(1) for r in records[1:]]==["P00924_ENO1_YEAST","P00925_ENO1_YEAST"]
          assert Path("ENO1_DATA_CLEANUP_REPORT.md").is_file()
          print("PASS 6677->6675 protein rows, ENO1+ENO2 preserved separately in EN01, 75 metadata-matched samples")
          PY
      - name: Commit only the two cleaned files and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pg_matrix.tsv EN01.xlsx ENO1_DATA_CLEANUP_REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "Separate ENO1_YEAST proteins and filter standalone EN01 sample columns [skip ci]"
            git push
          fi
